services:
  conduit-mongo:
    image: mongo:8.0
    container_name: conduit-mongo
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-conduit}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, run make docker/env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-conduit}
    volumes:
      - conduit-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  conduit-backend:
    build:
      context: ../conduit-backend
      dockerfile: ../conduit-docker/conduit-backend-echo/Dockerfile
    image: conduit-backend-echo:local
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      APP_LEVEL: ${APP_LEVEL:-development}
      DATABASE_URL: mongodb://${DB_USER:-conduit}:${DB_PASSWORD}@conduit-mongo:27017/${DB_NAME:-conduit}?authSource=admin
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required, run make docker/env}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      conduit-mongo:
        condition: service_healthy

volumes:
  conduit-mongo-data:
