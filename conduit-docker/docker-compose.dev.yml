services:
  conduit-mongo:
    image: mongo:8.0
    container_name: conduit-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_user
      MONGO_INITDB_ROOT_PASSWORD: dev_pass
      MONGO_INITDB_DATABASE: conduit_dev
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - conduit-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  conduit-mongo-express:
    image: mongo-express:1.0.2
    container_name: conduit-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://dev_user:dev_pass@conduit-mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      conduit-mongo:
        condition: service_healthy

volumes:
  conduit-mongo-data:
